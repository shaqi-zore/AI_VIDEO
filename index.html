<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam AI Video Engine</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --primary: #2ea043;
            --primary-hover: #3fb950;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --terminal-bg: #010409;
            --terminal-text: #0aff0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }
        .header h1 span { color: var(--primary); }
        .header p { color: var(--text-muted); font-size: 14px; }
        .container { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 600px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .upload-area { border: 2px dashed var(--border-color); border-radius: 8px; padding: 50px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background-color: rgba(46, 160, 67, 0.05); }
        .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; color: var(--text-muted); }
        .upload-text { font-size: 16px; font-weight: 500; margin-bottom: 5px; }
        .upload-hint { font-size: 12px; color: var(--text-muted); }
        .btn { display: block; width: 100%; padding: 14px; margin-top: 20px; background-color: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; text-align: center; text-decoration: none; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
        .terminal { display: none; background-color: var(--terminal-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-top: 20px; height: 250px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: var(--text-muted); text-align: left; }
        .terminal p { margin-bottom: 6px; line-height: 1.4; }
        .terminal .success { color: var(--terminal-text); }
        .terminal .highlight { color: #58a6ff; }
        .terminal .warning { color: #f0883e; }
        .result-area { display: none; text-align: center; margin-top: 20px; }
        .video-placeholder { width: 100%; height: 200px; background-color: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 20px; border: 1px solid var(--border-color); }
        #file-name-display { margin-top: 15px; font-size: 14px; color: var(--primary); font-weight: 500; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>Adam</span> AI Video Engine</h1>
        <p>全自动爆款视频拆解与渲染中枢 · 跨境专版</p>
    </div>
    <div class="container">
        <div id="step-upload">
            <div class="upload-area" id="drop-zone">
                <input type="file" id="video-input" accept="video/mp4,video/quicktime">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽原视频到此处</div>
                <div class="upload-hint">支持 MP4 / MOV 格式</div>
                <div id="file-name-display"></div>
            </div>
            <button class="btn" id="generate-btn" disabled>启动渲染引擎</button>
        </div>

        <div id="step-processing" style="display: none;">
            <h3 style="font-size: 16px; margin-bottom: 10px; text-align: center;">核心引擎运转中...</h3>
            <div class="terminal" id="terminal-screen"></div>
        </div>

        <div id="step-result" class="result-area">
            <div class="video-placeholder">▶ 视频预览 (云端处理完成)</div>
            <h3 style="font-size: 18px; margin-bottom: 10px; color: var(--terminal-text);">渲染成功！</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">视频已通过 Colab GPU 生成并返回。</p>
            <a href="#" class="btn" id="download-btn">下载高清成片</a>
            <a href="#" style="display: block; margin-top: 15px; color: var(--text-muted); font-size: 13px; text-decoration: underline;" onclick="resetEngine()">处理下一个视频</a>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('video-input');
        const generateBtn = document.getElementById('generate-btn');
        const fileNameDisplay = document.getElementById('file-name-display');
        const dropZone = document.getElementById('drop-zone');
        const terminalScreen = document.getElementById('terminal-screen');
        const downloadBtn = document.getElementById('download-btn');

        videoInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                fileNameDisplay.textContent = '已选择: ' + this.files[0].name;
                fileNameDisplay.style.display = 'block';
                generateBtn.disabled = false;
            } else {
                fileNameDisplay.style.display = 'none';
                generateBtn.disabled = true;
            }
        });

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                videoInput.files = e.dataTransfer.files;
                videoInput.dispatchEvent(new Event('change'));
            }
        });

        generateBtn.addEventListener('click', () => {
            document.getElementById('step-upload').style.display = 'none';
            document.getElementById('step-processing').style.display = 'block';
            terminalScreen.innerHTML = '<p>> Adam 正在连接 Colab 后端服务器...</p><p>> 正在上传视频至云端 GPU...</p>';
            
            const formData = new FormData();
            formData.append('video', videoInput.files[0]);

            // 这里已经为你填入了刚刚生成的真实接口地址
            const adamApiUrl = 'https://unnamed-giant-evoke.ngrok-free.dev/generate';

            fetch(adamApiUrl, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                terminalScreen.innerHTML += '<p class="highlight">> GPU 处理完毕，正在打包文件...</p>';
                terminalScreen.innerHTML += '<p class="success">> 数据回传成功！</p>';
                return response.blob();
            })
            .then(blob => {
                const videoUrl = URL.createObjectURL(blob);
                document.getElementById('step-processing').style.display = 'none';
                document.getElementById('step-result').style.display = 'block';
                downloadBtn.href = videoUrl;
                downloadBtn.download = 'adam_final_video.mp4';
            })
            .catch(error => {
                terminalScreen.innerHTML += `<p class="warning">> API 连接失败: 请检查 Colab 后端是否在运行，以及 ngrok 链接是否填写正确。</p>`;
            });
        });

        function resetEngine() {
            document.getElementById('step-result').style.display = 'none';
            document.getElementById('step-upload').style.display = 'block';
            videoInput.value = '';
            fileNameDisplay.style.display = 'none';
            generateBtn.disabled = true;
        }
    </script>
</body>
</html>
