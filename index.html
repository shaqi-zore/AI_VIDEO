<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam AI Video Engine - Local Dual-Model Edition</title>
    <style>
        :root {
            --bg-color: #0d1117; --panel-bg: #161b22; --primary: #2ea043; --primary-hover: #3fb950;
            --text-main: #c9d1d9; --text-muted: #8b949e; --border-color: #30363d; --terminal-bg: #010409; --terminal-text: #0aff0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
        .header h1 span { color: var(--primary); }
        .header p { color: var(--text-muted); font-size: 14px; }
        .container { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 700px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .upload-area { border: 2px dashed var(--border-color); border-radius: 8px; padding: 50px 20px; text-align: center; cursor: pointer; position: relative; transition: all 0.3s ease; }
        .upload-area:hover { border-color: var(--primary); background-color: rgba(46, 160, 67, 0.05); }
        .upload-area input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; color: var(--text-muted); }
        .upload-text { font-size: 16px; font-weight: 500; margin-bottom: 5px; }
        .upload-hint { font-size: 12px; color: var(--text-muted); }
        .btn { display: block; width: 100%; padding: 14px; margin-top: 20px; background-color: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }
        .terminal { background-color: var(--terminal-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-top: 20px; height: 180px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-muted); text-align: left; }
        .terminal p { margin-bottom: 6px; line-height: 1.4; }
        .terminal .highlight { color: #58a6ff; }
        .terminal .warning { color: #f0883e; }
        .video-placeholder { width: 100%; height: 200px; background-color: #000; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 20px; border: 1px solid var(--border-color); }
        
        .form-label { font-size: 14px; color: var(--primary); margin-bottom: 8px; display: block; font-weight: 600; }
        .form-textarea { width: 100%; background: var(--terminal-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; margin-bottom: 20px; font-family: inherit; resize: vertical; }
        .form-textarea:focus { outline: none; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>Adam</span> AI Video Engine</h1>
        <p>云盘全本地双模型闭环引擎 · 零限流高精度长视频管线</p>
    </div>
    <div class="container">
        
        <!-- 上传面板 -->
        <div id="step-upload">
            <div class="upload-area" id="drop-zone">
                <input type="file" id="video-input" accept="video/mp4,video/quicktime">
                <div class="upload-icon">📁</div>
                <div class="upload-text">拖拽长视频到此处进行云盘本地 AI 拆解</div>
                <div class="upload-hint">支持 MP4 / MOV 格式 · 本地双模型闭环驱动</div>
                <div id="file-name-display" style="margin-top:15px; color:var(--primary); font-weight:bold; display:none;"></div>
            </div>
            <button class="btn" id="analyze-btn" disabled>启动本地 AI 异步智能拆解</button>
        </div>

        <!-- 终端处理状态（轮询中） -->
        <div id="step-processing" style="display: none; text-align: center;">
            <h3 id="processing-title" style="font-size: 16px; margin-bottom: 10px; color: var(--text-main);">后台双模型异步处理中，请稍候...</h3>
            <div class="terminal" id="terminal-screen"></div>
        </div>

        <!-- 确认与编辑面板 -->
        <div id="step-review" style="display: none; text-align: left;">
            <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 18px; text-align: center;">👀 拆解完成，全量参数确认</h3>
            
            <label class="form-label">1. 提取的全部关键帧 (严格 10 秒步长时间轴横向排列):</label>
            <div id="review-keyframes-container" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; background: var(--terminal-bg);">
            </div>
            
            <label class="form-label">2. Whisper 提取的口播内容 (可修改):</label>
            <textarea id="review-audio-text" class="form-textarea" rows="2"></textarea>
            
            <label class="form-label">3. 本地 Qwen 视觉模型推演的动作剧本与 Prompt (可修改):</label>
            <textarea id="review-script" class="form-textarea" rows="10"></textarea>
            
            <button class="btn" id="confirm-render-btn">确认剧本无误，启动本地 SVD 模型 GPU 渲染</button>
        </div>

        <!-- 结果展示 -->
        <div id="step-result" style="display: none; text-align: center;">
            <video id="result-video" controls style="width: 100%; max-height: 300px; border-radius: 6px; margin-bottom: 20px; background: #000;"></video>
            <h3 style="font-size: 18px; margin-bottom: 10px; color: var(--terminal-text);">本地 GPU 渲染成功！</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">AI 闭环成片已生成。</p>
            <a href="#" class="btn" id="download-btn">下载最终成片</a>
            <a href="#" style="display: block; margin-top: 15px; color: var(--text-muted); font-size: 13px; text-decoration: underline;" onclick="location.reload()">处理下一个视频</a>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('video-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const terminalScreen = document.getElementById('terminal-screen');
        
        // 【已绑定最新 Cloudflare 隧道地址】
        const adamApiUrl = 'https://taught-obituaries-milwaukee-expect.trycloudflare.com';

        videoInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                document.getElementById('file-name-display').textContent = '已准备视频: ' + this.files[0].name;
                document.getElementById('file-name-display').style.display = 'block';
                analyzeBtn.disabled = false;
            }
        });

        analyzeBtn.addEventListener('click', async () => {
            document.getElementById('step-upload').style.display = 'none';
            document.getElementById('step-processing').style.display = 'block';
            terminalScreen.innerHTML = '<p>> 正在秒级上传长视频至云盘本地后端队列...</p>';
            
            const formData = new FormData();
            formData.append('video', videoInput.files[0]);

            try {
                const res = await fetch(`${adamApiUrl}/analyze`, { 
                    method: 'POST',
                    body: formData 
                });
                
                if (!res.ok) throw new Error('任务创建失败状态码: ' + res.status);
                const initData = await res.json();
                const taskId = initData.task_id;

                terminalScreen.innerHTML += `<p class="highlight">> 异步任务已创建 (ID: ${taskId.slice(0,8)}...)，本地 Qwen 视觉模型正在深度解析...</p>`;

                const pollInterval = setInterval(async () => {
                    try {
                        const statusRes = await fetch(`${adamApiUrl}/task_status/${taskId}`);
                        const taskData = await statusRes.json();

                        if (taskData.status === 'processing') {
                            terminalScreen.innerHTML += `<p>> ${taskData.step}</p>`;
                            terminalScreen.scrollTop = terminalScreen.scrollHeight;
                        } 
                        else if (taskData.status === 'completed') {
                            clearInterval(pollInterval);
                            
                            document.getElementById('step-processing').style.display = 'none';
                            document.getElementById('step-review').style.display = 'block';
                            
                            const framesContainer = document.getElementById('review-keyframes-container');
                            framesContainer.innerHTML = ''; 
                            
                            const frames = taskData.keyframes || [];
                            frames.forEach((imgBase64, index) => {
                                const imgWrap = document.createElement('div');
                                imgWrap.style = "flex: 0 0 auto; text-align: center; width: 130px;";
                                
                                const img = document.createElement('img');
                                img.src = imgBase64;
                                img.style = "width: 100%; border-radius: 4px; object-fit: cover; border: 1px solid #444;";
                                
                                const label = document.createElement('div');
                                label.style = "font-size: 12px; color: var(--primary); margin-top: 5px; font-weight: 500;";
                                label.textContent = `⏱️ 第 ${index * 10} 秒`;
                                
                                imgWrap.appendChild(img);
                                imgWrap.appendChild(label);
                                framesContainer.appendChild(imgWrap);
                            });

                            document.getElementById('review-audio-text').value = taskData.audio_text || "";
                            document.getElementById('review-script').value = taskData.action_script || "";
                        }
                        else if (taskData.status === 'failed') {
                            clearInterval(pollInterval);
                            throw new Error(taskData.error || '后台本地模型推理异常');
                        }
                    } catch (pollErr) {
                        console.warn("轮询网络波动，继续尝试...", pollErr);
                    }
                }, 3000);

            } catch (error) {
                console.error("前端报错：", error);
                terminalScreen.innerHTML += `<p class="warning">> 发生错误: ${error.message}</p>`;
                alert("请求失败，请检查控制台。");
            }
        });

        document.getElementById('confirm-render-btn').addEventListener('click', () => {
            document.getElementById('step-review').style.display = 'none';
            document.getElementById('step-processing').style.display = 'block';
            document.getElementById('processing-title').textContent = "本地 SVD 视频生成模型 GPU 渲染中，请稍候...";
            terminalScreen.innerHTML = '<p class="highlight">> 参数已锁定，SVD 模型正在根据首帧与剧本渲染 AI 视频...</p>';
            
            fetch(`${adamApiUrl}/render`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    final_prompt: document.getElementById('review-script').value,
                    audio_text: document.getElementById('review-audio-text').value
                })
            })
            .then(res => res.blob())
            .then(blob => {
                const videoUrl = URL.createObjectURL(blob);
                document.getElementById('step-processing').style.display = 'none';
                document.getElementById('step-result').style.display = 'block';
                
                const resultVideo = document.getElementById('result-video');
                resultVideo.src = videoUrl;

                const dlBtn = document.getElementById('download-btn');
                dlBtn.href = videoUrl;
                dlBtn.download = 'adam_final_generated.mp4';
            })
            .catch(error => {
                terminalScreen.innerHTML += `<p class="warning">> 渲染发生错误: ${error.message}</p>`;
            });
        });
    </script>
</body>
</html>
